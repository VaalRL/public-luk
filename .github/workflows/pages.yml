name: Deploy website to GitHub Pages

# 只在網站內容變動時重新部署
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只允許一個部署進行，新的推送會取消排隊中的舊部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 網站是純靜態檔案，不需要建置步驟
      # enablement: 倉庫還沒開啟 Pages 時，由這一步用 pages: write 權限自動開啟，
      # 省去手動到 Settings → Pages 設定；已開啟時這個參數不會有任何作用
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
